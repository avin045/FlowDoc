<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>FlowDoc recorder</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; font: 500 13px/1 system-ui, "Segoe UI", sans-serif; user-select: none; }
    .bar { display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 6px 0 0; border-radius: 999px; background: #0f172a; color: #f8fafc;
      box-shadow: 0 6px 20px rgba(15, 23, 42, .35); }
    /* Only the status area moves the window. Drag regions swallow clicks on
       Windows, so the buttons must stay outside them. */
    .grip { display: flex; align-items: center; height: 100%; padding: 0 6px 0 14px; cursor: grab; -webkit-app-region: drag; app-region: drag; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #f43f5e; margin-right: 8px; animation: pulse 1.4s infinite; }
    .paused .dot { background: #94a3b8; animation: none; }
    .label { margin-right: 8px; white-space: nowrap; }
    .meta { color: #94a3b8; font-variant-numeric: tabular-nums; white-space: nowrap; }
    button { all: unset; -webkit-app-region: no-drag; app-region: no-drag; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 11px; border-radius: 999px; color: #e2e8f0; font: inherit; white-space: nowrap; }
    button:hover { background: rgba(255, 255, 255, .12); }
    button:active { transform: scale(.96); }
    button:disabled { opacity: .5; cursor: progress; }
    .discard.confirm { background: #be123c; color: #fff; }
    .done { background: #4f46e5; color: #fff; }
    .done:hover { background: #4338ca; }
    svg { width: 15px; height: 15px; flex: none; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="grip" title="Drag to move">
      <span class="dot"></span><span class="label" id="label">Capturing</span>
      <span class="meta" id="meta">0 steps · 0:00</span>
    </div>
    <button id="toggle" title="Pause capture"></button>
    <button id="discard" class="discard" title="Discard this recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span id="discardLabel" hidden>Discard?</span></button>
    <button id="done" class="done" title="Stop and build the guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Done</button>
  </div>
  <script src="widget.js"></script>
</body>
</html>
