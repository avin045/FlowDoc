<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowDoc</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
  <script src="app/theme.js"></script>
  <link rel="stylesheet" href="app/app.css" />
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/docx.iife.js"></script>
  <script src="vendor/jszip.min.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" aria-label="Workspace">
      <a class="brand" href="#/"><img src="icons/logo.svg" alt="" width="28" height="28" /> FlowDoc</a>
      <a class="nav-item" href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
        All guides
      </a>
      <div class="nav-label">Recent</div>
      <div id="recentNav" class="recent-nav"></div>
      <div class="sidebar-foot">
        <div class="theme-toggle" role="radiogroup" aria-label="Theme">
          <button role="radio" data-theme-mode="system" title="Match system theme" aria-label="System theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>System</span>
          </button>
          <button role="radio" data-theme-mode="light" title="Light theme" aria-label="Light theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Light</span>
          </button>
          <button role="radio" data-theme-mode="dark" title="Dark theme" aria-label="Dark theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>Dark</span>
          </button>
        </div>
        <button id="howToCapture" class="capture-cta">
          <span class="rec"></span> New capture
        </button>
      </div>
    </nav>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept=".json,application/json" hidden />
  <input type="file" id="imageFile" accept="image/*" hidden />
  <script src="app/main.js" type="module"></script>
</body>
</html>
