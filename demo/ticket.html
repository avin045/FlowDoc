<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northwind Support — New ticket</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    header { background: #0e7490; color: #fff; padding: 16px 32px; font-weight: 700; font-size: 20px; display: flex; gap: 24px; align-items: center; }
    nav a { color: #cffafe; text-decoration: none; font-weight: 500; font-size: 15px; margin-right: 18px; }
    main { max-width: 720px; margin: 40px auto; background: #fff; border-radius: 14px; padding: 32px; box-shadow: 0 10px 30px rgba(15,23,42,.1); }
    label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { margin-top: 20px; padding: 11px 22px; border: 0; border-radius: 8px; background: #0e7490; color: #fff; font: 600 15px system-ui; cursor: pointer; }
    #done { display: none; margin-top: 20px; padding: 12px 16px; background: #ecfeff; border-radius: 8px; }
  </style>
</head>
<body>
  <header>Northwind Support <nav><a href="#">Tickets</a><a href="#">Knowledge base</a><a href="#">Settings</a></nav></header>
  <main>
    <h1 style="margin:0 0 8px;font-size:24px">Open a support ticket</h1>
    <label for="subject">Subject</label>
    <input id="subject" placeholder="Short summary of the problem" />
    <label for="priority">Priority</label>
    <select id="priority"><option>Low</option><option>Normal</option><option>High</option><option>Urgent</option></select>
    <label for="details">Details</label>
    <textarea id="details" rows="4"></textarea>
    <button id="submit" type="button" onclick="document.getElementById('done').style.display='block'">Submit ticket</button>
    <div id="done">Ticket #4821 created. We'll email you shortly.</div>
  </main>
</body>
</html>
